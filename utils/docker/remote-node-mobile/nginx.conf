worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;

    # Ignore forwarded addresses unless the immediate peer is explicitly trusted.
    # Mount narrowly scoped set_real_ip_from directives here when using a proxy.
    include /etc/nginx/trusted-proxies/*.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_zone $binary_remote_addr zone=rpc:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 15s;
    send_timeout 30s;
    client_body_temp_path /tmp/nginx/client;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    server {
        listen 33340 default_server;
        listen [::]:33340 default_server;
        limit_req zone=rpc burst=20 nodelay;
        limit_conn addr 30;
        limit_req_status 429;
        limit_conn_status 429;

        location = /general_info {
            root /home/mobile_app_config;
            expires 1s;
            limit_except GET { deny all; }
        }

        location = /general_info/config.json {
            root /home/mobile_app_config;
            expires 1s;
            limit_except GET { deny all; }
        }

        # Match whole registered wallet endpoints. Administrative paths are excluded.
        location ~ ^/(json_rpc|getheight|gettransactions|sendrawtransaction|getinfo|getblocks\.bin|get_o_indexes\.bin|getrandom_outs\.bin|getrandom_outs3\.bin|getrandom_outs4\.bin|get_tx_pool\.bin|check_keyimages\.bin|get_pos_details\.bin)$ {
            limit_except GET POST { deny all; }
            proxy_pass http://127.0.0.1:11211;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 120s;
        }

        location / { return 404; }
    }
}
