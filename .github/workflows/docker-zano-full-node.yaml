name: Build & push zano-full-node docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or tag to build from
        required: true
        default: master
      image_tag: 
        description: Docker Hub tag to publish (e.g. a version like 2.2.2.513)
        required: true
        default: latest
      update_latest:
        description: Also update the :latest tag to point at this build
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      SRC_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.branch }}
      IMAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.image_tag }}
      PUSH_LATEST: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.update_latest) }}
    steps:
      - uses: actions/checkout@v4
        #with:
          #ref: ${{ github.event.inputs.branch }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: utils/docker/zano-full-node/Dockerfile
          push: true
          build-args: |
            BRANCH=${{ env.SRC_REF }}
            CACHEBUST=${{ github.run_id }}
          tags: |
            zanoproject/zano-full-node:${{ env.IMAGE_TAG }}
            ${{ env.SRC_REF != env.IMAGE_TAG && format('zanoproject/zano-full-node:{0}', env.SRC_REF) || '' }}
            ${{ env.PUSH_LATEST == 'true' && 'zanoproject/zano-full-node:latest' || '' }}
          cache-from: type=registry,ref=zanoproject/zano-full-node:buildcache
          cache-to:   type=registry,ref=zanoproject/zano-full-node:buildcache,mode=max
