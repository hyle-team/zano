name: Build all platforms

# Fans the three per-platform workflows out across both networks in a single
# run. Each network tick box adds one build per platform, so ticking both
# produces six builds that all start at once (subject to runner availability).
#
# The platform workflows stay independently dispatchable; this one calls them
# through workflow_call, so everything lands in one run with one artifact list
# rather than six separate runs.

on:
  workflow_dispatch:
    inputs:
      mainnet:
        description: 'Build mainnet'
        type: boolean
        default: true
      testnet:
        description: 'Build testnet'
        type: boolean
        default: false
      increment:
        description: 'Increment build number'
        type: boolean
        default: true
      upload:
        description: 'Upload builds to the download server'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check-selection:
    name: Check selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: At least one network must be selected
        run: |
          mainnet='${{ inputs.mainnet }}'
          testnet='${{ inputs.testnet }}'

          if [ "$mainnet" != "true" ] && [ "$testnet" != "true" ]; then
            echo "::error title=Nothing to build::Tick 'Build mainnet', 'Build testnet', or both."
            exit 1
          fi

          networks=""
          if [ "$mainnet" = "true" ]; then networks="mainnet"; fi
          if [ "$testnet" = "true" ]; then networks="${networks:+$networks and }testnet"; fi

          {
            echo "### Building $networks"
            echo
            echo "| Platform | mainnet | testnet |"
            echo "| --- | --- | --- |"
            for platform in Linux macOS Windows; do
              echo "| $platform | $([ "$mainnet" = "true" ] && echo 'yes' || echo '-') | $([ "$testnet" = "true" ] && echo 'yes' || echo '-') |"
            done
            echo
            if [ "${{ inputs.increment }}" = "true" ]; then
              echo "Build number will be incremented first."
            else
              echo "Build number left as-is."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------ build number ---

  increment-build-number:
    name: Increment build number
    needs: check-selection
    if: inputs.increment == true
    uses: ./.github/workflows/increment-build-number.yml
    permissions:
      # The called workflow pushes the bump commit, and a called workflow can
      # never hold more permissions than its caller grants.
      contents: write
    secrets: inherit

  resolve-ref:
    name: Resolve build ref
    needs: [check-selection, increment-build-number]
    # Runs whether or not the bump happened, but not if the bump failed - in
    # that case nothing should be built, because the version would be wrong.
    if: ${{ !cancelled() && needs.check-selection.result == 'success' && needs.increment-build-number.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - name: Pick the commit every platform will build
        id: pick
        env:
          BUMP_SHA: ${{ needs.increment-build-number.outputs.sha }}
          BUMP_VERSION: ${{ needs.increment-build-number.outputs.version }}
        run: |
          # Reusable workflows check out a fixed commit, so the bump has to be
          # passed down explicitly - otherwise every build would compile the
          # pre-bump tree that triggered this run.
          if [ -n "$BUMP_SHA" ]; then
            ref="$BUMP_SHA"
            echo "building $BUMP_VERSION from the bump commit $ref"
            echo "Building **$BUMP_VERSION** from \`$ref\`" >> "$GITHUB_STEP_SUMMARY"
          else
            ref='${{ github.sha }}'
            echo "no bump requested; building the triggering commit $ref"
            echo "Building \`$ref\` (build number unchanged)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- mainnet ---
  #
  # Every build gate below keeps the !cancelled() guard on purpose. When
  # 'increment' is unticked, increment-build-number is skipped, and GitHub
  # propagates that skip down the whole needs chain (resolve-ref -> builds)
  # unless a job opts out with a status-check function. resolve-ref opts out;
  # a plain `if: inputs.mainnet == true` here does NOT, so the builds would
  # inherit the skip even though resolve-ref succeeded and the input is true.
  # Hence: opt out with !cancelled(), then require resolve-ref success and the
  # network selection explicitly. Do not shorten these back to `inputs.x == true`.

  linux-mainnet:
    name: Linux (mainnet)
    needs: resolve-ref
    if: ${{ !cancelled() && needs.resolve-ref.result == 'success' && inputs.mainnet == true }}
    uses: ./.github/workflows/build-linux.yml
    with:
      testnet: false
      ref: ${{ needs.resolve-ref.outputs.ref }}
    permissions:
      contents: read
    secrets: inherit

  macos-mainnet:
    name: macOS (mainnet)
    needs: resolve-ref
    if: ${{ !cancelled() && needs.resolve-ref.result == 'success' && inputs.mainnet == true }}
    uses: ./.github/workflows/build-macos.yml
    with:
      testnet: false
      ref: ${{ needs.resolve-ref.outputs.ref }}
    permissions:
      contents: read
    secrets: inherit

  windows-mainnet:
    name: Windows (mainnet)
    needs: resolve-ref
    if: ${{ !cancelled() && needs.resolve-ref.result == 'success' && inputs.mainnet == true }}
    uses: ./.github/workflows/build-windows.yml
    with:
      testnet: false
      ref: ${{ needs.resolve-ref.outputs.ref }}
    permissions:
      contents: read
      # Authenticode signing exchanges a GitHub OIDC token for Cloud KMS access.
      # A called workflow can never hold more than the caller grants it, so this
      # has to be requested here as well as in build-windows.yml.
      id-token: write
    secrets: inherit

  # ---------------------------------------------------------------- testnet ---

  linux-testnet:
    name: Linux (testnet)
    needs: resolve-ref
    if: ${{ !cancelled() && needs.resolve-ref.result == 'success' && inputs.testnet == true }}
    uses: ./.github/workflows/build-linux.yml
    with:
      testnet: true
      ref: ${{ needs.resolve-ref.outputs.ref }}
    permissions:
      contents: read
    secrets: inherit

  macos-testnet:
    name: macOS (testnet)
    needs: resolve-ref
    if: ${{ !cancelled() && needs.resolve-ref.result == 'success' && inputs.testnet == true }}
    uses: ./.github/workflows/build-macos.yml
    with:
      testnet: true
      ref: ${{ needs.resolve-ref.outputs.ref }}
    permissions:
      contents: read
    secrets: inherit

  windows-testnet:
    name: Windows (testnet)
    needs: resolve-ref
    if: ${{ !cancelled() && needs.resolve-ref.result == 'success' && inputs.testnet == true }}
    uses: ./.github/workflows/build-windows.yml
    with:
      testnet: true
      ref: ${{ needs.resolve-ref.outputs.ref }}
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  # ---------------------------------------------------------------- publish ---
  #
  # Once the selected builds have succeeded, repackage their artifacts under
  # Zano's public download names, upload them to the builds server, and print a
  # manifest for a human to sign. One job per network, each depending only on
  # its own builds, so a testnet failure never blocks the mainnet release and
  # vice versa. resolve-ref is in `needs` only to read the built commit; the
  # gate inspects the build jobs, and !cancelled() keeps the job from inheriting
  # the skip when a network was not selected (the same trap the build gates avoid).

  publish-mainnet:
    name: Publish mainnet
    needs: [resolve-ref, linux-mainnet, macos-mainnet, windows-mainnet]
    if: ${{ !cancelled() && inputs.upload == true
            && (needs.linux-mainnet.result == 'success' || needs.macos-mainnet.result == 'success' || needs.windows-mainnet.result == 'success')
            && needs.linux-mainnet.result != 'failure'
            && needs.macos-mainnet.result != 'failure'
            && needs.windows-mainnet.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true   # a server hiccup must not red-flag an otherwise good build
    permissions:
      contents: read
      actions: read   # download-artifact needs to read this run's artifacts
    steps:
      - name: Checkout the built commit (publish script + version)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
          submodules: false
          fetch-depth: 1
      - name: Resolve this network's artifact pattern
        id: meta
        run: echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - name: Download mainnet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dl
          pattern: '*-${{ steps.meta.outputs.branch }}-v*'
      - name: Repackage, upload, and print the signing manifest
        env:
          NETWORK: mainnet
          DL_DIR: dl
          SSH_TARGET: ${{ secrets.ZANO_BUILDS_SSH_TARGET }}
          SSH_KEY: ${{ secrets.ZANO_BUILDS_OPENSSH_KEY }}
          SSH_PORT: ${{ secrets.ZANO_BUILDS_SSH_PORT }}
          KNOWN_HOSTS: ${{ secrets.ZANO_BUILDS_KNOWN_HOSTS }}
        run: bash utils/ci_upload_builds.sh

  publish-testnet:
    name: Publish testnet
    needs: [resolve-ref, linux-testnet, macos-testnet, windows-testnet]
    if: ${{ !cancelled() && inputs.upload == true
            && (needs.linux-testnet.result == 'success' || needs.macos-testnet.result == 'success' || needs.windows-testnet.result == 'success')
            && needs.linux-testnet.result != 'failure'
            && needs.macos-testnet.result != 'failure'
            && needs.windows-testnet.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true   # a server hiccup must not red-flag an otherwise good build
    permissions:
      contents: read
      actions: read   # download-artifact needs to read this run's artifacts
    steps:
      - name: Checkout the built commit (publish script + version)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
          submodules: false
          fetch-depth: 1
      - name: Resolve this network's artifact pattern
        id: meta
        run: echo "branch=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
      - name: Download testnet artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dl
          pattern: '*-${{ steps.meta.outputs.branch }}-testnet-v*'
      - name: Repackage, upload, and print the signing manifest
        env:
          NETWORK: testnet
          DL_DIR: dl
          SSH_TARGET: ${{ secrets.ZANO_BUILDS_SSH_TARGET }}
          SSH_KEY: ${{ secrets.ZANO_BUILDS_OPENSSH_KEY }}
          SSH_PORT: ${{ secrets.ZANO_BUILDS_SSH_PORT }}
          KNOWN_HOSTS: ${{ secrets.ZANO_BUILDS_KNOWN_HOSTS }}
        run: bash utils/ci_upload_builds.sh
