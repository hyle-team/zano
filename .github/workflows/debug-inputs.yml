name: Debug dispatch inputs

# Throwaway diagnostic. Mirrors build-all.yml's job graph
on:
  workflow_dispatch:
    inputs:
      mainnet:
        description: 'Build mainnet'
        type: boolean
        default: true
      testnet:
        description: 'Build testnet'
        type: boolean
        default: false
      increment:
        description: 'Increment build number'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check-selection:
    name: 1 - inputs at top of graph
    runs-on: ubuntu-latest
    steps:
      - name: Dump inputs and gate probes
        run: |
          echo 'toJSON(inputs) = ${{ toJSON(inputs) }}'
          echo "gate probes (each prints true/false):"
          echo "  mainnet:   == true -> ${{ inputs.mainnet == true }}   | == 'true' -> ${{ inputs.mainnet == 'true' }}"
          echo "  testnet:   == true -> ${{ inputs.testnet == true }}   | == 'true' -> ${{ inputs.testnet == 'true' }}"
          echo "  increment: == true -> ${{ inputs.increment == true }} | == 'true' -> ${{ inputs.increment == 'true' }}"

  increment:
    name: 2 - increment gate (mirrors real == true gate)
    needs: check-selection
    if: inputs.increment == true
    runs-on: ubuntu-latest
    steps:
      - run: echo "increment gate PASSED - this job ran"

  resolve-ref:
    name: 3 - resolve-ref (tolerates a skipped increment)
    needs: [check-selection, increment]
    if: ${{ !cancelled() && needs.check-selection.result == 'success' && needs.increment.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "resolve-ref ran; increment result = '${{ needs.increment.result }}'"

  report-downstream:
    name: 4 - inputs as seen downstream (always runs)
    needs: resolve-ref
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'toJSON(inputs) downstream = ${{ toJSON(inputs) }}'

  mainnet-old-form:
    name: 5a - mainnet gate OLD form (== true)
    needs: resolve-ref
    if: inputs.mainnet == true
    runs-on: ubuntu-latest
    steps:
      - run: echo "OLD-form mainnet gate PASSED - a real build WOULD run"

  mainnet-string-form:
    name: 5b - mainnet gate string-tolerant form (== true || == 'true')
    needs: resolve-ref
    if: inputs.mainnet == true || inputs.mainnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "STRING-form mainnet gate PASSED (this form is ineffective for the real cause)"

  mainnet-structural-form:
    name: 5c - mainnet gate STRUCTURAL fix (!cancelled + needs success + == true)
    needs: resolve-ref
    if: ${{ !cancelled() && needs.resolve-ref.result == 'success' && inputs.mainnet == true }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "STRUCTURAL-fix mainnet gate PASSED - this is the real fix"
