name: Increment build number

# Bumps PROJECT_VERSION_BUILD_NO in src/version.h.in by one and merges the
# change through a pull request, following the repository's existing commit
# convention ("=== build number: 507 -> 508 ===").
#
# Callable on its own, or from build-all.yml, which passes the resulting commit
# SHA down to the platform builds so they all compile the bumped number.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      build_number:
        description: 'PROJECT_VERSION_BUILD_NO after the bump'
        value: ${{ jobs.increment.outputs.build_number }}
      previous_build_number:
        description: 'PROJECT_VERSION_BUILD_NO before the bump'
        value: ${{ jobs.increment.outputs.previous_build_number }}
      version:
        description: 'Full version string after the bump, e.g. 2.2.1.509'
        value: ${{ jobs.increment.outputs.version }}
      sha:
        description: 'SHA of the commit carrying the bump - build from this'
        value: ${{ jobs.increment.outputs.sha }}

permissions:
  contents: read

jobs:
  increment:
    name: Increment build number
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Needed to push the bump branch and create its pull request.
      contents: write
      pull-requests: write
    # Two runs bumping at once would race on the push; serialise per branch.
    concurrency:
      group: increment-build-number-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      build_number: ${{ steps.bump.outputs.build_number }}
      previous_build_number: ${{ steps.bump.outputs.previous_build_number }}
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Refuse to bump anything but a branch
        run: |
          if [ "${{ github.ref_type }}" != "branch" ]; then
            echo "::error title=Cannot increment::This workflow pushes a commit, so it must run on a branch. It was dispatched on ${{ github.ref_type }} '${{ github.ref_name }}'."
            exit 1
          fi

      - name: Check that the bump app is configured
        env:
          # The app id is not sensitive, so it can live in either namespace -
          # accept both, since Variables and Secrets are separate tabs and it is
          # easy to add it to the wrong one.
          APP_ID: ${{ vars.CI_BUMP_APP_ID || secrets.CI_BUMP_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.CI_BUMP_APP_PRIVATE_KEY }}
        run: |
          missing=""
          if [ -z "$APP_ID" ]; then
            missing="CI_BUMP_APP_ID (add it as a repository Variable, or a Secret)"
          fi
          if [ -z "$APP_PRIVATE_KEY" ]; then
            missing="${missing:+$missing and }CI_BUMP_APP_PRIVATE_KEY (must be a repository Secret)"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Bump app not configured::Missing $missing. Settings > Secrets and variables > Actions has separate tabs for Secrets and Variables; check the value landed on one of them and is repository-scoped, not tied to an environment this job does not declare."
            exit 1
          fi
          echo "bump app id resolved"

      # Use a GitHub App token to push the bump branch and create its pull
      # request.
      - name: Mint a token for the bump app
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CI_BUMP_APP_ID || secrets.CI_BUMP_APP_ID }}
          private-key: ${{ secrets.CI_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          fetch-depth: 1
          # Unlike the build workflows, this one has to push a bump branch and
          # create a pull request, so use the app token rather than GITHUB_TOKEN.
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Increment PROJECT_VERSION_BUILD_NO
        id: bump
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          file=src/version.h.in
          pattern='^[[:space:]]*#define[[:space:]]+PROJECT_VERSION_BUILD_NO[[:space:]]+[0-9]+[[:space:]]*$'

          matches=$(grep -cE "$pattern" "$file" || true)
          if [ "$matches" -ne 1 ]; then
            echo "::error title=Cannot increment::Expected exactly one PROJECT_VERSION_BUILD_NO definition in $file, found $matches"
            exit 1
          fi

          previous=$(sed -nE 's/^[[:space:]]*#define[[:space:]]+PROJECT_VERSION_BUILD_NO[[:space:]]+([0-9]+)[[:space:]]*$/\1/p' "$file")
          if [ -z "$previous" ]; then
            echo "::error title=Cannot increment::Could not read the current build number from $file"
            exit 1
          fi
          next=$((previous + 1))

          sed -i -E "s|^([[:space:]]*#define[[:space:]]+PROJECT_VERSION_BUILD_NO[[:space:]]+)[0-9]+([[:space:]]*)$|\1${next}\2|" "$file"

          # Read it back rather than trusting the substitution.
          written=$(sed -nE 's/^[[:space:]]*#define[[:space:]]+PROJECT_VERSION_BUILD_NO[[:space:]]+([0-9]+)[[:space:]]*$/\1/p' "$file")
          if [ "$written" != "$next" ]; then
            echo "::error title=Cannot increment::Rewrite failed - $file now reads '$written', expected '$next'"
            exit 1
          fi

          quoted_define() {
            sed -nE "s/^[[:space:]]*#define[[:space:]]+$1[[:space:]]+\"([^\"]*)\".*$/\1/p" "$file"
          }
          version="$(quoted_define PROJECT_MAJOR_VERSION).$(quoted_define PROJECT_MINOR_VERSION).$(quoted_define PROJECT_REVISION).${next}"

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add "$file"
          commit_title="=== build number: ${previous} -> ${next} ==="
          git commit -m "$commit_title"

          bump_branch="ci/build-number-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:$bump_branch"
          pr_url=$(gh pr create \
            --repo "$REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$bump_branch" \
            --title "$commit_title" \
            --body "Automated build-number increment: ${previous} -> ${next}.")
          gh pr merge "$pr_url" --auto --delete-branch --repo "$REPOSITORY"

          sha=""
          for attempt in {1..30}; do
            pr_state=$(gh pr view "$pr_url" --repo "$REPOSITORY" \
              --json state,mergeCommit \
              --jq '[.state, (.mergeCommit.oid // "")] | @tsv')
            IFS=$'\t' read -r state sha <<< "$pr_state"
            if [ "$state" = "MERGED" ] && [ -n "$sha" ]; then
              break
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "::error title=Pull request closed::The build-number pull request was closed without being merged."
              exit 1
            fi
            sleep 10
          done
          if [ -z "$sha" ]; then
            echo "::error title=Pull request not merged::The build-number pull request was not merged within five minutes."
            exit 1
          fi

          {
            echo "previous_build_number=$previous"
            echo "build_number=$next"
            echo "version=$version"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build number ${previous} -> ${next}"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`$version\` |"
            echo "| Branch | \`$BASE_BRANCH\` |"
            echo "| Commit | \`$sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "bumped $previous -> $next ($version) as $sha"
