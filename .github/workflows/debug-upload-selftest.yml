name: Debug - build-server upload self-test

# Throwaway diagnostic. Verifies the build-server upload secrets and exercises
# utils/ci_upload_builds.sh end-to-end WITHOUT running a real build:
#   1. the three secrets are present and the key is OpenSSH (not a .ppk),
#   2. SSH auth works against the pinned ed25519 host key and the builds dir is writable,
#   3. ci_upload_builds.sh renames + uploads a fake artifact into a temp subdir, which is
#      then removed.
# Dispatch manually from master. Delete this file once satisfied.

on:
  workflow_dispatch:
    inputs:
      do_upload:
        description: 'Connect to the server and do a real test upload (uncheck for a secrets-presence check only)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  selftest:
    name: Upload self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (for utils/ci_upload_builds.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          fetch-depth: 1

      - name: Check secrets are present (no values printed)
        env:
          SSH_TARGET: ${{ secrets.ZANO_BUILDS_SSH_TARGET }}
          SSH_KEY: ${{ secrets.ZANO_BUILDS_OPENSSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ZANO_BUILDS_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.ZANO_BUILDS_SSH_PORT }}
        run: |
          set -eu
          fail=0
          chk() { if [ -n "$2" ]; then echo "  OK   $1 is set"; else echo "  MISS $1 is NOT set"; fail=1; fi; }
          chk ZANO_BUILDS_SSH_TARGET  "${SSH_TARGET:-}"
          chk ZANO_BUILDS_OPENSSH_KEY "${SSH_KEY:-}"
          chk ZANO_BUILDS_KNOWN_HOSTS "${KNOWN_HOSTS:-}"
          if [ -n "${SSH_PORT:-}" ]; then echo "  OK   ZANO_BUILDS_SSH_PORT is set"; else echo "  --   ZANO_BUILDS_SSH_PORT not set (defaults to 22)"; fi
          case "${SSH_KEY:-}" in
            *"BEGIN OPENSSH PRIVATE KEY"*|*"BEGIN RSA PRIVATE KEY"*|*"BEGIN EC PRIVATE KEY"*) echo "  OK   key is an OpenSSH private key" ;;
            *"PuTTY-User-Key-File"*) echo "  MISS key is a PuTTY .ppk - export it to OpenSSH format"; fail=1 ;;
            "") : ;;
            *) echo "  MISS key has no OpenSSH BEGIN header"; fail=1 ;;
          esac
          case "${KNOWN_HOSTS:-}" in
            *ssh-ed25519*) echo "  OK   known_hosts has an ed25519 entry" ;;
            "") : ;;
            *) echo "  WARN known_hosts has no ssh-ed25519 entry (the scp pins ed25519)" ;;
          esac
          [ "$fail" -eq 0 ] || { echo "::error::secret presence/format check failed"; exit 1; }
          echo "secret checks passed"

      - name: Connect, write-test, and exercise ci_upload_builds.sh
        if: ${{ inputs.do_upload == true || inputs.do_upload == 'true' }}
        env:
          SSH_TARGET: ${{ secrets.ZANO_BUILDS_SSH_TARGET }}
          SSH_KEY: ${{ secrets.ZANO_BUILDS_OPENSSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ZANO_BUILDS_KNOWN_HOSTS }}
          SSH_PORT: ${{ secrets.ZANO_BUILDS_SSH_PORT }}
          REMOTE_BASE: /var/www/html/builds
        run: |
          set -euo pipefail
          echo "::add-mask::${SSH_TARGET#*@}"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_selftest && chmod 600 ~/.ssh/id_selftest
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          SSHOPTS=(-i "$HOME/.ssh/id_selftest" -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -p "${SSH_PORT:-22}")
          testdir="${REMOTE_BASE}/_ci_selftest_${GITHUB_RUN_ID}"

          echo "== 1. auth + pinned host key =="
          ssh "${SSHOPTS[@]}" "$SSH_TARGET" 'echo "  connected as $(whoami)@$(hostname)"'

          echo "== 2. builds dir writable =="
          ssh "${SSHOPTS[@]}" "$SSH_TARGET" "test -d '$REMOTE_BASE' && test -w '$REMOTE_BASE' && echo '  writable: $REMOTE_BASE'"

          if [ -f utils/ci_upload_builds.sh ]; then
            echo "== 3. exercise ci_upload_builds.sh into a temp subdir =="
            ssh "${SSHOPTS[@]}" "$SSH_TARGET" "mkdir -p '$testdir'"
            d='dl/zano-linux-x64-gui-selftest-v0.0.0.0[deadbee]'
            mkdir -p "$d"
            printf 'ci upload self-test run %s at %s\n' "${GITHUB_RUN_ID}" "$(date -u +%FT%TZ)" > "$d/payload.AppImage"
            NETWORK=mainnet DL_DIR=dl OUT_DIR=selftest_out \
              REMOTE_DIR="$testdir" URL_BASE="https://build.zano.org/builds/_ci_selftest_${GITHUB_RUN_ID}" \
              UPLOAD_RETRIES=1 \
              bash utils/ci_upload_builds.sh
            echo "== 4. verify it landed =="
            ssh "${SSHOPTS[@]}" "$SSH_TARGET" "ls -la '$testdir'"
            echo "SELF-TEST OK (secrets + connectivity + ci_upload_builds.sh)"
          else
            echo "::warning::utils/ci_upload_builds.sh is not on this branch - skipped the script exercise; secrets + connectivity were verified"
          fi

      - name: Clean up the temp subdir
        if: ${{ always() && (inputs.do_upload == true || inputs.do_upload == 'true') }}
        env:
          SSH_TARGET: ${{ secrets.ZANO_BUILDS_SSH_TARGET }}
          SSH_PORT: ${{ secrets.ZANO_BUILDS_SSH_PORT }}
          REMOTE_BASE: /var/www/html/builds
        run: |
          set -uo pipefail
          [ -f "$HOME/.ssh/id_selftest" ] || { echo "no ssh key set up; nothing to clean"; exit 0; }
          echo "::add-mask::${SSH_TARGET#*@}"
          SSHOPTS=(-i "$HOME/.ssh/id_selftest" -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -p "${SSH_PORT:-22}")
          testdir="${REMOTE_BASE}/_ci_selftest_${GITHUB_RUN_ID}"
          ssh "${SSHOPTS[@]}" "$SSH_TARGET" "rm -rf '$testdir' && echo 'removed $testdir'" || echo "cleanup was best-effort (temp dir may not exist)"
